name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and validate community release
        env:
          APP_VERSION: ${{ github.ref_name }}
          BUILD_VERSION: ${{ github.run_number }}
        run: |
          APP_VERSION="${APP_VERSION#v}"
          if [[ ! "$APP_VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Release tags must be v followed by one to three dot-separated integers (for example, v1.0.0)."
            exit 1
          fi
          export APP_VERSION
          make release
          echo "DMG=dist/Caffeine-${APP_VERSION}-build-${BUILD_VERSION}-macOS-universal.dmg" >> "$GITHUB_ENV"
          echo "CHECKSUM=dist/Caffeine-${APP_VERSION}-build-${BUILD_VERSION}-macOS-universal.dmg.sha256" >> "$GITHUB_ENV"

      - name: Attest release artifacts
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            ${{ env.DMG }}
            ${{ env.CHECKSUM }}

      - name: Create draft release with downloadable DMG
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            Caffeine is a tiny menu bar app that keeps your Mac awake exactly the way you want—without adding another window or Dock icon.

            ### What you can do

            - Keep your Mac awake while letting the display sleep
            - Keep the display on
            - Prevent the screen saver
            - Keep a MacBook working with its lid closed
            - Restore your choices after a restart and launch quietly at login

            ### Install

            Download the DMG below, drag Caffeine into **Applications**, and open it. This free community build is distributed outside the App Store, so macOS may ask you to confirm it with **Open Anyway** the first time. If you choose the optional lid-closed feature, Caffeine walks you through its one-time setup—no Terminal commands needed.

            Works on Intel and Apple silicon Macs running macOS 14 or later. Free, open source, private, and completely offline.

            [Installation help](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/README.md#download-and-install) · [Lid-closed mode guide](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/README.md#optional-lid-closed-helper) · [Source code](${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }})
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$DMG" \
            "$CHECKSUM" \
            --draft \
            --verify-tag \
            --generate-notes \
            --notes "$RELEASE_NOTES" \
            --title "Caffeine ${GITHUB_REF_NAME#v}"
